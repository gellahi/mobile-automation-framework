name: Android Mobile Automation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android Emulator
        run: |
          sdkmanager --install "system-images;android-34;google_apis;x86_64"
          echo "no" | avdmanager create avd -n test_emulator -k "system-images;android-34;google_apis;x86_64" --force

      - name: Start Emulator
        run: |
          emulator -avd test_emulator -no-window -no-audio -no-boot-anim &
          adb wait-for-device
          echo "Waiting for emulator to fully boot..."
          adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 2; done;'
          adb shell input keyevent 82
          echo "Emulator is ready"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium Server
        run: |
          appium &
          sleep 10

      - name: Build & Run Tests
        run: mvn clean test --batch-mode

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 14
